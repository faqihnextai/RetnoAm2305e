name: Build and Deploy to cPanel

on:
  push:
    branches: [ main ] # Ganti ke master jika branch Anda master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Project
        run: pnpm run build

      - name: Sync / Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.vireta2.com
          username: Faqih@vireta2.site
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          dangerous-clean-slate: false
          local-dir: dist/
          server-dir: ./
