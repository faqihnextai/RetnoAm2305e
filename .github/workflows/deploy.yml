name: Build and Deploy to cPanel

on:
  push:
    branches: [ main ] # Ubah ke master jika branch utama Anda bernama master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Sync / Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.vireta2.com
          username: Faqih@vireta2.site
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          dangerous-clean-slate: false
          local-dir: dist/
          server-dir: ./
